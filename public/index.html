<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tamil IPTV Player</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <header class="header">
      <h1>Tamil IPTV</h1>
      <span id="count" class="muted"></span>
      <button id="reloadBtn" title="Reload playlist">⟳</button>
    </header>
    <div class="controls">
      <input type="search" id="search" placeholder="Search channels…" autocomplete="off">
      <select id="group"><option value="all">All</option></select>
    </div>
    <div id="channels" class="channels-list"></div>
  </aside>

  <main class="player-container">
    <div class="video-wrapper">
      <video id="video" autoplay playsinline></video>
      <div class="player-overlay">
        <span id="status">Loading playlist…</span>
        <span id="latency">Latency: --</span>
        <span id="quality">Quality: --</span>
      </div>
      <div class="vc" id="vc">
        <button id="vcPlay" class="vc-btn" type="button" aria-label="Play / pause"></button>
        <button id="vcLive" class="vc-live" type="button" aria-label="Go to live" disabled><i></i><span id="vcLiveTxt">LIVE</span></button>
        <span class="vc-sp"></span>
        <button id="vcMute" class="vc-btn" type="button" aria-label="Mute / unmute"></button>
        <button id="vcFs" class="vc-btn" type="button" aria-label="Fullscreen"></button>
      </div>
    </div>
    <div class="now"><b id="nowName">—</b><span id="nowGroup" class="muted"></span></div>
    <section class="epg" id="epg" hidden>
      <div class="epg-row"><span class="epg-tag">NOW</span><b class="epg-title" id="epgNowT"></b><span class="epg-time" id="epgNowTime"></span></div>
      <div class="epg-bar"><i id="epgBar"></i></div>
      <p class="epg-desc" id="epgDesc"></p>
      <div class="epg-row"><span class="epg-tag nx">NEXT</span><span class="epg-title" id="epgNextT"></span><span class="epg-time" id="epgNextTime"></span></div>
      <button id="epgMore" type="button" aria-expanded="false">Full schedule ▾</button>
      <ol class="epg-list" id="epgList" hidden></ol>
    </section>
    <div class="player-controls">
      <button id="liveBtn">Go live</button>
      <button id="favBtn">☆ Favourite</button>
      <label>Quality <select id="qualitySelect"><option value="-1">Auto</option></select></label>
      <label>Latency <select id="edgeSelect"><option value="default">Default</option><option value="near">Low</option></select></label>
    </div>
  </main>
</div>
</body>
</html>
